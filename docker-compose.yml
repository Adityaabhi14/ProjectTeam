services:
  # =================================================================
  # 🗄️ Database: MySQL 8.0 Engine
  # Automatically initializes schema and seed datasets
  # =================================================================
  db:
    image: mysql:8.0
    container_name: carepoint_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-hospital_management_db}
      MYSQL_USER: ${DB_USER:-carepoint_user}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-carepoint_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - carepoint_network

  # =================================================================
  # ⚙️ Backend: Node.js Express REST API
  # Connects to MySQL container with automatic health validation
  # =================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: carepoint_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-hospital_management_db}
      JWT_SECRET: ${JWT_SECRET:-carepoint_hospital_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health | grep -q 'online' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - carepoint_network

  # =================================================================
  # 🌐 Frontend: React + Vite + Nginx Reverse Proxy
  # Production SPA build served by high-performance Nginx Alpine
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carepoint_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_DEV_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - carepoint_network

# Persistent storage for MySQL database files
volumes:
  mysql_data:
    name: carepoint_mysql_data

# Internal bridge network for isolated inter-container communication
networks:
  carepoint_network:
    name: carepoint_network
    driver: bridge
