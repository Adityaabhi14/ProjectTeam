services:
  # =================================================================
  # 🗄️ Database: MySQL 8.0 Development Engine
  # =================================================================
  db:
    image: mysql:8.0
    container_name: carepoint_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-hospital_management_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - carepoint_dev_network

  # =================================================================
  # ⚙️ Backend: Express Server with Live Watch Mode
  # =================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: carepoint_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_NAME: ${DB_NAME:-hospital_management_db}
      JWT_SECRET: ${JWT_SECRET:-carepoint_hospital_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./index.html:/app/index.html
      - ./style.css:/app/style.css
      - ./script.js:/app/script.js
      - ./assets:/app/assets
    depends_on:
      db:
        condition: service_healthy
    networks:
      - carepoint_dev_network

  # =================================================================
  # 🌐 Frontend: React + Vite Dev Server with HMR
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: carepoint_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - carepoint_dev_network

volumes:
  mysql_dev_data:
    name: carepoint_mysql_dev_data

networks:
  carepoint_dev_network:
    name: carepoint_dev_network
    driver: bridge
